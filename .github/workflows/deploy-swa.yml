name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        working-directory: OASIS
        run: npm ci

      - name: Build API (bundle core/ dependencies)
        working-directory: OASIS/api
        run: |
          npm ci
          npm run build
          cp host.json dist/
          cp local.settings.json dist/ 2>/dev/null || true
          cat > dist/package.json << 'EOF'
          {
            "name": "oasis-api",
            "version": "1.0.0",
            "private": true,
            "main": "functions/*.js",
            "dependencies": {
              "@azure/functions": "^4.0.0"
            }
          }
          EOF

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_APPINSIGHTS_IKEY: ${{ secrets.OASIS_APPINSIGHTS_IKEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/OASIS/app"
          api_location: "/OASIS/api/dist"
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"

